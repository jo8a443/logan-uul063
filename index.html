<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGAN UUL063 - GESTIÓN & CRECIMIENTO CO.</title>
    
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">
    
    <style>
        :root {
            --negro-profundo: #0a0a0b;
            --azul-suave: #5da9e9;
            --plateado: #c0c0c2;
            --gris-tarjeta: #161b22;
            --texto-brillante: #f0f6fc;
            --verde-exito: #2ecc71;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--negro-profundo); padding: 10px; margin: 0; color: var(--texto-brillante); }

        .header { 
            background: linear-gradient(180deg, #161b22 0%, #0a0a0b 100%); 
            color: var(--plateado); padding: 20px; text-align: center; 
            border-radius: 0 0 25px 25px; border-bottom: 2px solid var(--azul-suave);
        }

        .resumen-card { 
            background: var(--gris-tarjeta); padding: 15px; border-radius: 18px; 
            margin: 15px 0; text-align: center; border: 1px solid #30363d;
        }
        .resumen-card h2 { margin: 5px 0; font-size: 1.8rem; color: var(--azul-suave); }

        .card { background: var(--gris-tarjeta); padding: 18px; border-radius: 18px; border: 1px solid #30363d; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: var(--plateado); font-size: 0.7rem; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; 
            border: 1px solid #30363d; box-sizing: border-box; font-size: 16px; 
            background: #0d1117; color: white;
        }

        #btnGuardar { 
            background: linear-gradient(135deg, #1f4068 0%, #16213e 100%); 
            color: var(--plateado); border: 1px solid var(--azul-suave); 
            padding: 16px; width: 100%; border-radius: 12px; 
            font-weight: bold; margin-top: 20px; font-size: 1rem;
        }

        #buscador { width:100%; border: 1px solid var(--azul-suave); background: #0d1117; padding: 12px; border-radius: 10px; color: white; margin-bottom: 15px; box-sizing: border-box; }

        .contenedor-tabla { overflow-x: auto; background: var(--gris-tarjeta); border-radius: 15px; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #0d1117; color: var(--azul-suave); padding: 12px; font-size: 0.7rem; text-transform: uppercase; }
        td { border-bottom: 1px solid #21262d; padding: 12px; font-size: 0.8rem; text-align: center; color: var(--plateado); }

        .pago-tag { font-size: 0.65rem; background: #232d3b; padding: 4px 8px; border-radius: 6px; color: var(--azul-suave); font-weight: bold; border: 1px solid #30363d; }

        .botones-finales { display: flex; gap: 10px; margin-top: 20px; }
        .btn-sec { background: #30363d; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
        .btn-excel { background: var(--verde-exito); color: white; }

        .footer-empresa { 
            margin-top: 40px; background: white; padding: 25px; 
            border-radius: 30px 30px 0 0; text-align: center; color: #1a1a1a;
        }
        .btn-whatsapp { 
            display: inline-flex; align-items: center; justify-content: center; 
            background: #25d366; color: white; padding: 12px 25px; border-radius: 50px; 
            text-decoration: none; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 1.2rem;">LOGAN GRIS COMET</h1>
        <div style="color: var(--azul-suave); font-weight: bold;">PLACA: UUL-063</div>
    </div>

    <div class="resumen-card">
        <p style="margin:0; font-size: 0.8rem;">Inversión Total Acumulada</p>
        <h2 id="totalGastado">$ 0</h2>
        <p id="totalRegistros" style="color:var(--azul-suave); margin:5px 0 0 0; font-size:0.8rem;">0 Registros</p>
    </div>

    <div class="card">
        <label>Fecha</label>
        <input type="date" id="fecha">
        
        <label>Servicio</label>
        <select id="servicio">
            <option value="Cambio de aceite">Cambio de aceite</option>
            <option value="Frenos">Frenos</option>
            <option value="Sincronización">Sincronización</option>
            <option value="Llantas">Llantas</option>
            <option value="Batería">Batería</option>
            <option value="SOAT / Seguros">SOAT / Seguros</option>
            <option value="Impuestos">Impuestos</option>
            <option value="Lavado">Lavado General</option>
            <option value="Otro">Otro servicio</option>
        </select>

        <label>Marca Repuesto</label>
        <input type="text" id="marca" placeholder="Ej: Elf, Bosch">

        <label>Lugar / Taller</label>
        <input type="text" id="lugar" placeholder="¿Dónde se hizo?">

        <label>Detalle Adicional</label>
        <input type="text" id="detalle" placeholder="Observaciones">

        <label>Valor Pagado ($)</label>
        <input type="number" id="precio" placeholder="0">

        <label>Método de Pago</label>
        <select id="metodoPago">
            <option value="Efectivo">Efectivo</option>
            <option value="Nequi">Nequi</option>
            <option value="Daviplata">Daviplata</option>
            <option value="Tarjeta">Tarjeta</option>
        </select>

        <label>Kilometraje Actual</label>
        <input type="number" id="km" placeholder="KM hoy">

        <label>Próximo Kilometraje</label>
        <input type="number" id="prox" placeholder="KM sugerido">
        
        <button id="btnGuardar" onclick="guardar()">GUARDAR REGISTRO PROFESIONAL</button>
    </div>

    <input type="text" id="buscador" onkeyup="filtrar()" placeholder="🔍 Buscar servicio o fecha...">

    <div class="contenedor-tabla">
        <table id="tablaMain">
            <thead>
                <tr>
                    <th>Fecha / Servicio</th>
                    <th>Marca / Lugar</th>
                    <th>Valor / Pago</th>
                    <th>KM Actual</th>
                    <th>Próximo KM</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="botones-finales">
        <button class="btn-sec btn-excel" onclick="exportar()">📊 EXCEL</button>
        <button class="btn-sec" onclick="document.getElementById('inputFile').click()">📥 IMPORTAR</button>
    </div>
    <input type="file" id="inputFile" style="display:none" onchange="importar(this)" accept=".csv">

    <div class="footer-empresa">
        <div style="font-weight: bold; font-size: 1.2rem;">
            <span style="color:#0056b3">GESTIÓN &</span> <span style="color:#555">CRECIMIENTO CO.</span>
        </div>
        <div style="font-size: 0.8rem; color: #666; font-style: italic;">"De la estrategia a los resultados"</div>
        <a href="https://wa.me/573150581701" class="btn-whatsapp" target="_blank">💬 Soporte Técnico G&C</a>
    </div>

    <script>
        const KEY = 'DB_LOGAN_UUL063_MAESTRO';

        document.addEventListener("DOMContentLoaded", () => dibujar());

        function guardar() {
            const i = {
                id: Date.now(),
                fecha: document.getElementById('fecha').value,
                servicio: document.getElementById('servicio').value,
                marca: document.getElementById('marca').value || "-",
                lugar: document.getElementById('lugar').value || "-",
                detalle: document.getElementById('detalle').value || "-",
                precio: document.getElementById('precio').value,
                metodo: document.getElementById('metodoPago').value,
                km: document.getElementById('km').value || "0",
                prox: document.getElementById('prox').value || "0"
            };
            if(!i.fecha || !i.precio) return alert("Completa Fecha y Precio");
            let h = JSON.parse(localStorage.getItem(KEY)) || [];
            h.push(i);
            localStorage.setItem(KEY, JSON.stringify(h));
            ['marca', 'lugar', 'detalle', 'precio', 'km', 'prox'].forEach(id => document.getElementById(id).value = "");
            dibujar();
            alert("✅ Guardado en base de datos G&C");
        }

        function dibujar() {
            const tbody = document.querySelector('#tablaMain tbody');
            const h = JSON.parse(localStorage.getItem(KEY)) || [];
            tbody.innerHTML = "";
            let total = 0;
            h.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            h.forEach(i => {
                total += Number(i.precio);
                const fila = tbody.insertRow();
                fila.innerHTML = `
                    <td><b>${i.fecha}</b><br>${i.servicio}</td>
                    <td><b>${i.marca}</b><br><small>${i.lugar}</small></td>
                    <td><b style="color:var(--azul-suave)">$${Number(i.precio).toLocaleString()}</b><br><span class="pago-tag">${i.metodo}</span></td>
                    <td>${Number(i.km).toLocaleString()}</td>
                    <td>${Number(i.prox).toLocaleString()}</td>
                    <td><button onclick="borrar(${i.id})" style="background:transparent; border:1px solid #444; color:red; border-radius:5px; padding:5px;">X</button></td>
                `;
            });
            document.getElementById('totalGastado').innerText = "$ " + total.toLocaleString();
            document.getElementById('totalRegistros').innerText = h.length + " Registros Totales";
        }

        function borrar(id) {
            if(confirm("¿Eliminar registro?")) {
                let h = JSON.parse(localStorage.getItem(KEY)) || [];
                h = h.filter(x => x.id !== id);
                localStorage.setItem(KEY, JSON.stringify(h));
                dibujar();
            }
        }

        function filtrar() {
            let v = document.getElementById("buscador").value.toUpperCase();
            let filas = document.querySelector("#tablaMain tbody").rows;
            for (let f of filas) f.style.display = f.innerText.toUpperCase().includes(v) ? "" : "none";
        }

        function exportar() {
            const h = JSON.parse(localStorage.getItem(KEY)) || [];
            let csv = "sep=;\nFecha;Servicio;Marca;Lugar;Detalle;Precio;Metodo;KM_Actual;KM_Prox\n";
            h.forEach(i => csv += `${i.fecha};${i.servicio};${i.marca};${i.lugar};${i.detalle};${i.precio};${i.metodo};${i.km};${i.prox}\n`);
            const blob = new Blob(["\ufeff", csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = 'Mantenimiento_Logan_UUL063.csv';
            link.click();
        }

        function importar(input) {
            const reader = new FileReader();
            reader.onload = function() {
                const lines = reader.result.split('\n').slice(2);
                let historial = [];
                lines.forEach(line => {
                    const d = line.split(';');
                    if(d.length > 5) historial.push({ id: Date.now()+Math.random(), fecha: d[0], servicio: d[1], marca: d[2], lugar: d[3], detalle: d[4], precio: d[5], metodo: d[6], km: d[7], prox: d[8] });
                });
                localStorage.setItem(KEY, JSON.stringify(historial));
                dibujar();
                alert("✅ Importado con éxito");
            };
            reader.readAsText(input.files[0]);
        }
    </script>
</body>
</html>
